
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7e8"><title>投稿一颗蛋｜免费鸡蛋篮</title><link rel="icon" href="./assets/favicon.png?v=3" type="image/png"><style>
:root{--ink:#40383d;--cream:#fffaf1;--yellow:#ffe38e}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;background-image:radial-gradient(#e9e0d6 .9px,transparent 1px);background-size:24px 24px}a{color:inherit}header{background:#fff9f1;border-bottom:2px solid var(--ink)}.wrap{max-width:940px;margin:auto;padding:0 22px}header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:75px;gap:18px}header a{text-decoration:none;font-weight:800}header .brand{display:flex;align-items:center;gap:8px;font-size:21px}header img{width:48px;height:48px;object-fit:contain}main{padding-top:38px;padding-bottom:70px}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.hero h1{font-size:clamp(30px,5vw,42px);margin:4px 0}.hero p{color:#806f77;margin:0}.hero img{width:155px;max-width:25%;object-fit:contain}.card{background:white;border:2px solid var(--ink);box-shadow:5px 5px var(--ink);border-radius:24px;padding:28px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:750}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;border:1.5px solid #d6c4bd;background:#fffdf8;padding:11px 13px;border-radius:12px;font:inherit;color:var(--ink)}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #f4cddd}.field small{font-size:12px;font-weight:normal;color:#8b7a80}.explain{background:#fff1e9;border-radius:14px;padding:13px 16px;margin:18px 0;color:#806f77;font-size:13px}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.btn{background:var(--yellow);border:2px solid var(--ink);border-radius:12px;padding:11px 23px;font-weight:900;font:inherit;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.status{color:#74626d;font-size:13px}.result{display:none;margin:15px 0;background:#f3faea;border:1.5px dashed #a4bf85;border-radius:12px;padding:13px}.trap{position:absolute;left:-10000px;opacity:0}.verify{min-height:65px}@media(max-width:620px){.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.card{padding:18px}.hero img{width:85px}.brand{font-size:17px!important}}
</style></head><body><header><div class="wrap"><a class="brand" href="./"><img src="./assets/brand-mark.webp?v=3" alt="">免费鸡蛋篮</a><a href="./">← 返回鸡蛋列表</a></div></header><main class="wrap"><div class="hero"><div><small>FOUND A NEW EGG?</small><h1>来投稿一颗蛋 🥚</h1><p>发现免费 API 额度了？分享一下，我们来核实。</p></div><img src="./assets/eku-happy.webp" alt="Eku"></div><section class="card"><form id="submission"><div class="fields">
<label class="field">平台 / 活动名称 *<input name="provider" minlength="2" maxlength="100" required placeholder="例如：某平台注册送额度"></label>
<label class="field">活动类型 *<select name="category"><option>官方模型厂商 / 推理平台</option><option>可信公益站</option><option>其他（待评估）</option></select></label>
<label class="field wide">官方活动 / 领取链接 *<input name="claim_url" type="url" pattern="https://.*" maxlength="700" required placeholder="https://..."><small>尽量提供真实领取页面，而不是平台官网。</small></label>
<label class="field">免费额度<input name="credits" maxlength="160" placeholder="例如：注册送 $20"></label>
<label class="field">可用模型<input name="models" maxlength="220" placeholder="例如：GPT、Claude、Gemini"></label>
<label class="field wide">领取条件<input name="requirements" maxlength="320" placeholder="例如：是否绑卡、地区、验证码、充值要求"></label>
<label class="field wide">补充说明 *<textarea name="details" minlength="10" maxlength="2000" required placeholder="在哪看到的？有哪些领取限制或官方说明？"></textarea><small>不要填写 API Key、密码或其他个人敏感信息。</small></label>
</div><label class="trap" aria-hidden="true">网站<input name="website" tabindex="-1" autocomplete="off"></label>
<p class="explain">无需登录 GitHub，提交后会生成公开的 GitHub 待审核 Issue，任何人都可以查看你填写的内容。请勿填写 API Key、密码、邮箱、手机号等个人敏感信息。审核通过后才会加入网站鸡蛋列表。人机验证由 Cloudflare Turnstile 提供。</p>
<div id="captcha" class="verify"></div><div class="controls"><button id="send" type="submit" class="btn" disabled>提交鸡蛋</button><button id="retry" type="button" class="btn" hidden>重新连接 / 验证</button><div id="state" class="status" role="status" aria-live="polite">正在检查投稿服务…</div></div><div id="result" class="result" role="status"></div></form></section></main>
<script>
(() => {
  "use strict";
  const form=document.querySelector("#submission"),send=document.querySelector("#send"),state=document.querySelector("#state"),box=document.querySelector("#captcha"),result=document.querySelector("#result"),retry=document.querySelector("#retry");
  let key="",captcha="",widget=null,enabled=false,busy=false,loading=false;
  function msg(value){state.textContent=value}
  function controls(){send.disabled=busy||!enabled||!captcha;retry.disabled=busy||loading}
  function failure(value){captcha="";loading=false;retry.hidden=false;msg(value);controls()}
  function reset(){captcha="";controls();if(window.turnstile&&widget!==null)window.turnstile.reset(widget)}
  async function request(url,options){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
    try{
      const response=await fetch(url,{...options,signal:controller.signal});
      let value;
      try{value=await response.json()}catch(error){if(error.name==="AbortError")throw error;throw Error("投稿服务暂不可用，请重新验证后稍后重试。")}
      return {response,value};
    }finally{clearTimeout(timer)}
  }
  function render(){
    loading=false;
    try{
      widget=window.turnstile.render(box,{
        sitekey:key,action:"submission",
        callback:value=>{captcha=value;retry.hidden=true;controls();if(!busy)msg("验证完成，可以投稿。")},
        "expired-callback":()=>{failure("验证过期，请重新完成验证。")},
        "timeout-callback":()=>{failure("验证超时，请重新验证。")},
        "error-callback":()=>{failure("验证失败，请点击重新验证。");return true}
      });
      enabled=true;controls();msg("填写后请完成人机验证。")
    }catch{enabled=false;failure("人机验证加载失败，请重新连接。")}
  }
  async function init(){
    if(loading||busy)return;
    loading=true;enabled=false;captcha="";retry.hidden=true;controls();msg("正在检查投稿服务…");
    try{
      const {response,value:conf}=await request("./api/submissions/config",{cache:"no-store"});
      if(!response.ok)throw Error();
      if(!conf.enabled||typeof conf.siteKey!=="string"||!conf.siteKey){failure("投稿通道正在配置中，暂时无法提交。");return}
      key=conf.siteKey;
      const script=document.createElement("script");
      script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";script.async=true;
      let settled=false;
      const finish=()=>{if(settled)return false;settled=true;clearTimeout(timer);return true};
      const failed=()=>{if(!finish())return;script.remove();failure("人机验证加载失败，请重新连接。")};
      const timer=setTimeout(failed,15000);
      script.onload=()=>{if(finish())render()};
      script.onerror=failed;
      document.head.appendChild(script);
    }catch{failure("投稿服务暂不可用，请稍后重新连接。")}
  }
  retry.addEventListener("click",()=>{
    if(busy||loading)return;
    retry.hidden=true;
    if(enabled&&widget!==null){msg("请重新完成人机验证。");reset()}
    else return init();
  });
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    if(busy||!enabled)return;
    if(!form.reportValidity())return;
    if(!captcha){msg("请先完成人机验证。");return}
    result.style.display="none";busy=true;controls();msg("正在提交…");
    const data=Object.fromEntries(new FormData(form).entries());data.turnstile_token=captcha;
    try{
      const {response,value:receipt}=await request("./api/submissions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});
      if(!response.ok||receipt?.ok!==true)throw Error(typeof receipt?.message==="string"?receipt.message:"投稿失败，请重新验证后重试。");
      if(!Number.isSafeInteger(receipt.issue_number)||receipt.issue_number<1||receipt.issue_url!=="https://github.com/if-u-can/free-ai-credits/issues/"+receipt.issue_number)throw Error("暂时无法确认投稿结果，内容已保留，请重新验证后重试。");
      form.reset();
      result.textContent=receipt.duplicate?"这个链接已有投稿记录，请查看审核进度。 ":"投稿成功，已经进入待审核列表！ ";
      const link=document.createElement("a");link.href=receipt.issue_url;link.target="_blank";link.rel="noopener noreferrer";link.textContent="查看投稿 #"+receipt.issue_number;result.appendChild(link);
      result.style.display="block";msg(receipt.duplicate?"已找到这个链接的投稿记录。":"收到你的鸡蛋啦。");
    }catch(error){msg(error.name==="AbortError"?"投稿连接超时，内容已保留，请重新验证后重试。":error instanceof TypeError?"网络连接失败，内容已保留，请重新验证后重试。":error.message||"投稿失败，请重新验证后重试。")}
    finally{busy=false;reset();controls()}
  });
  init();
})();
</script></body></html>
