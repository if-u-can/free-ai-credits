<script>
(()=>{"use strict";const form=document.querySelector("#submission"),send=document.querySelector("#send"),state=document.querySelector("#state"),box=document.querySelector("#captcha"),result=document.querySelector("#result");let key="",captcha="",widget=null,enabled=false;
