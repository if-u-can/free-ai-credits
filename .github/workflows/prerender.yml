name: prerender-seo
on:
  push:
    branches: [main]
    paths: ['data/**']
  schedule:
    - cron: '30 0 * * *'   # 每天 08:30（北京时间）兜底刷新一次
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prerender.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git diff --cached --quiet || (git commit -m "chore: prerender static egg list for SEO" && git pull --rebase origin main && git push)
